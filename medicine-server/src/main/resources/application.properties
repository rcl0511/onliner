# 1) ?? ?? (DB, JPA, Multipart ?)
# =====================================================
spring.datasource.url=jdbc:mariadb://localhost:3306/medicine_server?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
spring.datasource.username=rcl_user
spring.datasource.password=rcl_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.highlight_sql=true

server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.mvc.static-path-pattern=/exports/**
spring.servlet.multipart.location=${UPLOAD_DIR:./uploads}

# 파일 경로 설정
file.upload.dir=${UPLOAD_DIR:./uploads}
file.export.dir=${EXPORT_DIR:./exports}
file.template.dir=${TEMPLATE_DIR:src/main/resources/templates}

# =====================================================
# 2) ?? ?? SMTP ?? ??
# =====================================================
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-email-password

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# (??)
# spring.mail.default-encoding=UTF-8
# spring.mail.properties.mail.smtp.from=no-reply@your-domain.com
server.error.include-message=always
server.error.include-binding-errors=always
server.error.whitelabel.enabled=false

# JWT (반드시 환경변수 JWT_SECRET 설정 필요)
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=480

# 로그인 간소화 (개발용)
auth.dev-bypass=false

# 토스페이먼츠 (환경변수로 설정)
toss.secret-key=${TOSS_SECRET_KEY:}